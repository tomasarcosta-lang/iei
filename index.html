<!doctype html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iei</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef6ee;--g1:#cfe8d2;--sage:#8fb59a;--dark:#3f7a5a;--ink:#24362b;--mut:#6c7f71;--glass:rgba(255,255,255,.66);--solid:#fff;--line:rgba(63,122,90,.16);--sh:0 10px 30px rgba(63,122,90,.13);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a14;--g1:#22392b;--sage:#6f9c7e;--dark:#7cc79a;--ink:#e4f0e7;--mut:#9db3a3;--glass:rgba(28,46,36,.62);--solid:#1a2b21;--line:rgba(160,220,185,.16);--sh:0 10px 30px rgba(0,0,0,.35)}}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:radial-gradient(900px 500px at 12% -10%,var(--g1),transparent 60%),radial-gradient(700px 500px at 100% 100%,var(--g1),transparent 55%),var(--bg);overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--dark);outline-offset:2px}
.mut{color:var(--mut)}.grow{flex:1}
#app{min-height:100%}
.view{min-height:100vh;display:flex;flex-direction:column;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.glass{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:var(--sh)}
.card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh)}
.btn{background:var(--dark);color:#fff;padding:.7rem 1.2rem;border-radius:14px;font-weight:600;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.soft{background:var(--g1);color:var(--ink)}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.1rem;background:var(--glass);border:1px solid var(--line);transition:transform .15s}
.ic:hover{transform:scale(1.07)}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--sage);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.3rem;flex:none}
.av.sm{width:38px;height:38px;font-size:1rem}.av.lg{width:84px;height:84px;font-size:2rem}
/* boot */
.boot{place-items:center;justify-content:center;align-items:center}
.boot img{width:min(260px,60vw);animation:pop 1.2s ease both}
@keyframes pop{0%{opacity:0;transform:scale(.85)}40%{opacity:1}100%{opacity:1;transform:scale(1)}}
/* accounts */
.center{align-items:center;justify-content:center;padding:32px 20px;gap:28px;text-align:center}
.hero img{width:170px}.hero h1{margin:.2rem 0 .3rem;font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;letter-spacing:-.02em}
.accts{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:880px}
.acct{width:250px;padding:16px;display:flex;align-items:center;gap:14px;text-align:left;position:relative;cursor:pointer;transition:transform .2s,box-shadow .2s}
.acct:hover{transform:translateY(-4px)}
.acct b{display:block}.acct small{color:var(--mut);font-size:.75rem}
.dots{margin-left:auto;width:34px;height:34px;border-radius:10px;font-size:1.2rem}.dots:hover{background:var(--g1)}
.menu{display:none;position:absolute;right:12px;top:58px;background:var(--solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:6px;z-index:5;min-width:140px}
.menu.open{display:block;animation:in .15s}
.menu button{display:block;width:100%;text-align:left;padding:.6rem .8rem;border-radius:10px}.menu button:hover{background:var(--g1)}
/* dashboard */
.top{display:flex;align-items:center;gap:12px;margin:14px;padding:10px 14px;border-radius:22px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:4}
.brand{display:flex;align-items:center;gap:8px;font-weight:800}.brand img{height:34px}
.pill{background:var(--dark);color:#fff;border-radius:999px;padding:.5rem 1rem;font-weight:600}
.who{font-weight:600}
main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:12px 20px 110px}
main h2{margin:.6rem 0 1.2rem;font-size:1.5rem;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.app{padding:20px;text-align:left;cursor:pointer;transition:transform .2s,box-shadow .2s;min-height:150px;display:flex;flex-direction:column;gap:6px}
.app:hover{transform:translateY(-5px) scale(1.015)}
.app .em{font-size:2.2rem;width:58px;height:58px;border-radius:18px;background:var(--g1);display:grid;place-items:center}
.app b{margin-top:6px}.app small{color:var(--mut);line-height:1.35}
.pager{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:22px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sage);opacity:.4}.dot.on{opacity:1;width:22px;border-radius:8px}
.empty{text-align:center;padding:48px 20px;color:var(--mut)}.empty .em{font-size:2.6rem}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px;padding:8px;border-radius:24px;z-index:4}
.dock button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 16px;border-radius:16px;font-size:.75rem;font-weight:600;transition:background .15s,transform .15s}
.dock button span{font-size:1.4rem}.dock button:hover{background:var(--g1);transform:translateY(-3px)}
/* inputs, modal, drawer, toast */
.in{width:100%;padding:.75rem .9rem;border-radius:14px;border:1px solid var(--line);background:var(--solid);margin:.25rem 0 .7rem}
label{font-size:.82rem;font-weight:600;color:var(--mut)}
.err{color:#b4443c;font-size:.8rem;min-height:1em;margin:-.4rem 0 .4rem}
.scrim{position:fixed;inset:0;background:rgba(20,40,28,.32);display:grid;place-items:center;z-index:20;animation:fade .2s;padding:16px}
@keyframes fade{from{opacity:0}}
.modal{background:var(--solid);border-radius:26px;padding:24px;width:min(440px,100%);max-height:92vh;overflow:auto;box-shadow:var(--sh);animation:in .25s}
.modal h3{margin:0 0 14px}.row{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);background:var(--solid);z-index:21;padding:24px;box-shadow:var(--sh);overflow:auto;animation:slide .3s ease}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.sec{margin:20px 0 6px;font-weight:800}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--bg);padding:.65rem 1rem;border-radius:14px;font-size:.9rem;animation:in .25s;max-width:92vw}
.toast.err{background:#b4443c;color:#fff}
.frame{flex:1;width:100%;border:0;background:#fff;border-radius:18px;margin:0 auto}
.note{font-size:.8rem;color:var(--mut);background:var(--g1);border-radius:14px;padding:.7rem .9rem;margin:0 0 16px}
@media(max-width:600px){.who{display:none}.acct{width:100%}.dock button{padding:8px 12px}}
@media(max-width:600px){.top{gap:6px;margin:10px;padding:8px 10px;flex-wrap:nowrap}.top>*{flex:none}.top .brand img{height:28px}.top .pill{white-space:nowrap;padding:.45rem .75rem;font-size:.85rem}.top .pill br{display:none}.top .ic{width:36px;height:36px}.top .av.sm{width:34px;height:34px}main{padding:8px 14px 110px}.glass,.card{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--solid)}.view{min-height:100dvh}.dock button{white-space:nowrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pad{padding:20px;margin-bottom:16px}.big{font-size:2rem;font-weight:800;letter-spacing:-.02em}
.bar{height:10px;border-radius:8px;background:var(--g1);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--dark);border-radius:8px;transition:width .4s}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:12px 0;font-size:.9rem}.kv span{color:var(--mut)}
.row2{display:flex;align-items:center;gap:10px;justify-content:space-between}.tag{background:var(--g1);border-radius:999px;padding:.15rem .7rem;font-size:.75rem;font-weight:800}
.scroll{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;background:var(--glass);border-radius:14px}.tbl th,.tbl td{padding:.55rem .7rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.brand img{height:40px;width:auto}.hero img{width:260px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand img,:root:not([data-theme="light"]) .hero img,:root:not([data-theme="light"]) .boot img{background:#fff;border-radius:14px;padding:6px 10px}}
select.in{appearance:auto}textarea.in{resize:vertical}
.msg{margin:.6rem 0;line-height:1.55}.msg.me{text-align:right}.md .mh{margin:.8rem 0 .3rem;font-weight:800}.md .mp{margin:.35rem 0}.md ul,.md ol{margin:.3rem 0;padding-left:1.3rem}.md li{margin:.15rem 0}.md code{background:var(--g1);border-radius:6px;padding:0 .3rem}.md pre.cb{background:var(--g1);border-radius:12px;padding:.7rem;overflow:auto;white-space:pre-wrap}.md blockquote{border-left:3px solid var(--sage);margin:.4rem 0;padding-left:.7rem;color:var(--mut)}.md hr{border:0;border-top:1px solid var(--line)}

/* ---- iei AI · design para telemóvel + modo programação ---- */
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bubtx:#0d1f15}}
.view:has(.chatm){height:100dvh;min-height:0}
.chatm{display:flex;flex-direction:column;min-height:0;padding:0 14px 10px;max-width:760px}
.chatlog{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding:6px 2px 14px;-webkit-overflow-scrolling:touch}
.bub{padding:12px 14px;border-radius:20px;line-height:1.55;overflow-wrap:anywhere;font-size:.97rem;max-width:100%}
.bub.me{align-self:flex-end;max-width:88%;background:var(--dark);color:var(--bubtx,#fff);border-bottom-right-radius:6px}
.qav{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.bub.ia{align-self:stretch;background:var(--glass);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--sh)}
.composer{flex:none;padding:10px;border-radius:24px;display:flex;flex-direction:column;gap:8px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--g1);border-radius:14px;padding:3px}
.seg button{padding:.5rem .9rem;border-radius:11px;font-weight:800;font-size:.82rem;min-height:38px}
.seg button.on,.tgl.on{background:var(--dark);color:#fff}
.tgl{padding:.5rem .8rem;border-radius:12px;font-weight:700;font-size:.82rem;min-height:38px;background:var(--solid);border:1px solid var(--line)}
.ctl .ic{width:38px;height:38px;margin-left:auto}
.hint{font-size:.74rem;color:var(--mut);line-height:1.35}
.crow{display:flex;gap:8px;align-items:flex-end}
.crow textarea{flex:1;height:clamp(72px,14dvh,128px);resize:none;max-height:38dvh;overflow-y:auto;overscroll-behavior:contain;margin:0;font-size:16px;border-radius:18px;padding:.7rem 1rem}
.sendb{width:48px;height:48px;border-radius:50%;background:var(--dark);color:#fff;font-size:1.2rem;flex:none}
.sendb:disabled{opacity:.5}
.pred{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pred[hidden]{display:none}
.pchip{padding:.35rem .75rem;border-radius:999px;background:var(--g1);border:1px solid var(--line);font-size:.8rem;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:34px;transition:background .15s,transform .15s}
.pchip:hover{background:var(--sage);color:#fff;transform:translateY(-1px)}
.prdy{font-size:.74rem;font-weight:800;color:var(--dark)}
.gw{position:relative;flex:1;display:flex;min-width:0}
.ghost{position:absolute;inset:0;padding:.7rem 1rem;border:1px solid transparent;border-radius:18px;font:inherit;font-size:16px;white-space:pre-wrap;overflow-wrap:break-word;overflow:hidden;pointer-events:none;z-index:1}
.gs{color:var(--mut);opacity:.8}

.cbw{margin:.6rem 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--solid)}
.cbh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 12px;background:var(--g1);font-size:.75rem;font-weight:700}
.cbb{display:flex;gap:6px}
.cbb button{padding:.4rem .7rem;border-radius:10px;background:var(--solid);border:1px solid var(--line);font-weight:700;font-size:.74rem;min-height:36px}
.cbb button.dl{background:var(--dark);color:#fff}
.md .cbw pre.cb{margin:0;border-radius:0;max-height:60vh;overflow:auto;white-space:pre;font-size:.8rem;padding:12px;-webkit-overflow-scrolling:touch}
.askm{text-align:center}.askm .em{font-size:2.8rem;width:72px;height:72px;margin:0 auto 10px;border-radius:22px;background:linear-gradient(135deg,var(--g1),var(--sage));display:grid;place-items:center;box-shadow:var(--sh)}
.askm h3{font-size:1.2rem;margin:0 0 8px}.askm p{margin:0 0 16px;color:var(--mut);line-height:1.45}
.askm .row{flex-direction:column-reverse;justify-content:stretch}.askm .row .btn{width:100%;padding:.85rem 1.2rem}
.dlc{width:min(440px,100%);text-align:left}.dlc h3{margin:0 0 4px}.dlc p{margin:0 0 12px;font-size:.85rem}
.dlr{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--g1);margin-bottom:8px}
.dli{font-size:1.6rem;width:46px;height:46px;border-radius:14px;background:var(--solid);display:grid;place-items:center;flex:none}
.dlt{flex:1;min-width:0}.dlt small{display:block;color:var(--mut)}
.dlb{height:8px;border-radius:8px;background:var(--solid);overflow:hidden;margin:6px 0 3px}.dlb i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--dark));border-radius:8px;transition:width .3s}
.dlm{font-size:.78rem;font-weight:600;color:var(--dark)}.dlr[data-st=err] .dlm{color:#b3402f}
.dlc .btn{width:100%;margin-top:6px}.dlc .btn:disabled{opacity:.6}
</style></head>

const TONES={friendly:{label:"😊 Amigável",prompt:"Fala de forma calorosa e próxima, com empatia e emojis ocasionais."},cheerful:{label:"😄 Alegre",prompt:"Fala de forma alegre e entusiasta, com humor leve quando apropriado."},calm:{label:"😌 Calmo",prompt:"Fala com serenidade, paciência e gentileza, sem exageros."},direct:{label:"🎯 Direto",prompt:"Fala de forma objetiva e concisa, sem rodeios nem emojis desnecessários."},professional:{label:"💼 Profissional",prompt:"Fala de forma formal, respeitosa e bem estruturada."}};
const toneOptions=value=>Object.entries(TONES).map(([id,t])=>`<option value="${id}" ${id===value?"selected":""}>${t.label}</option>`).join("");
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let DB={accounts:[],store:[]};
try{const r=JSON.parse(localStorage.getItem("iei")||"null");if(r&&r.accounts)DB=r}catch(e){}
const save=()=>{try{localStorage.setItem("iei",JSON.stringify(DB));return true}catch(e){toast("Não foi possível guardar neste navegador.","err");return false}};
let S={view:"boot",uid:null,page:0,q:"",app:null,drawer:false};
try{const u=sessionStorage.getItem("iei-uid");if(u&&DB.accounts.some(a=>a.id===u)){S.uid=u;S.view="dash"}}catch(e){}
const me=()=>DB.accounts.find(a=>a.id===S.uid);
const $=s=>document.querySelector(s);
function toast(t,k){const d=document.createElement("div");d.className="toast "+(k||"");d.textContent=t;$("#toasts").append(d);setTimeout(()=>d.remove(),3200)}
const av=(a,c="")=>a.photo?`<img class="av ${c}" src="${a.photo}" alt="">`:`<div class="av ${c}">${E(a.name.trim()[0]||"?").toUpperCase()}</div>`;
const b64=u8=>btoa(String.fromCharCode(...u8));
async function hashPw(pw,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:150000,hash:"SHA-256"},k,256);return b64(new Uint8Array(bits))}
const newSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));
function genId(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>c[x%c.length]).join("");let id;do{id=`IEI-${r(4)}-${r(4)}`}while(DB.accounts.some(a=>a.ieiId===id));return id}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=200,c=document.createElement("canvas");c.width=c.height=s;const m=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,s,s);res(c.toDataURL("image/jpeg",.85))};i.onerror=()=>res(null);i.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}

/* ---------- views ---------- */
function vBoot(){return `<div class="view boot"><img src="${LOGO}" alt="iei"></div>`}
function vAccounts(){setTimeout(LOCAL.auto,60);return `<div class="view center"><div class="hero"><img src="${LOGO}" alt="iei"><h1>Bem-vindo ao iei</h1><p class="mut">Escolhe uma conta para continuar.</p></div>
<div class="accts">${DB.accounts.map(a=>`<div class="card acct" data-act="login" data-id="${a.id}" tabindex="0">${av(a)}<div><b>${E(a.name)}</b><small>${E(a.ieiId)}</small></div><button class="dots" data-act="menu" aria-label="Opções">⋮</button><div class="menu"><button data-act="shutdown">Desligar</button></div></div>`).join("")}</div>
${DB.accounts.length?"":`<p class="mut">Ainda não há contas neste dispositivo.</p>`}
<button class="btn" data-act="new">Criar conta</button>
${dlCard()}
<p class="mut" style="max-width:420px;font-size:.8rem">As contas ficam guardadas só neste navegador. A associação entre dispositivos precisa de um backend e ainda não está ligada.</p></div>`}
function vDash(){const u=me(),apps=u.apps.map(id=>DB.store.find(s=>s.id===id)).filter(Boolean).filter(allowedApp),per=8,pages=Math.max(1,Math.ceil(apps.length/per));S.page=Math.min(S.page,pages-1);
return `<div class="view"><header class="top glass"><button class="ic" data-act="switch" aria-label="Voltar às contas">←</button><div class="brand"><img src="${LOGO}" alt="iei"></div><button class="pill" data-act="ai">✦ iei AI</button><span class="grow"></span><span class="who">${E(u.name)}</span>${av(u,"sm")}<button class="ic" data-act="drawer" aria-label="Definições">⚙</button></header>
<main><h2>Olá, ${E(u.name.split(" ")[0])}</h2>
${apps.length?`<div class="grid">${apps.slice(S.page*per,S.page*per+per).map(a=>`<div class="card app" data-act="open" data-id="${a.id}" tabindex="0"><div class="em">${E(a.emoji||"🧩")}</div><b>${E(a.name)}</b><small>${E(a.desc||"")}</small></div>`).join("")}</div>
${pages>1?`<div class="pager"><button class="ic" data-act="pg" data-d="-1">‹</button>${Array.from({length:pages},(_,i)=>`<i class="dot ${i===S.page?"on":""}"></i>`).join("")}<button class="ic" data-act="pg" data-d="1">›</button></div>`:""}`
:`<div class="card empty"><div class="em">🌱</div><p><b>Não tens aplicações instaladas.</b><br>Visita a iei Store.</p><button class="btn" data-act="store">Abrir a iei Store</button></div>`}</main>
<nav class="dock glass"><button data-act="store"><span>🛍️</span>iei Store</button></nav></div>`}
function vStore(){const u=me(),q=S.q.toLowerCase(),list=DB.store.filter(allowedApp).filter(a=>(a.name+a.desc+a.cat).toLowerCase().includes(q));
return `<div class="view"><header class="top glass"><button class="ic" data-act="dash" aria-label="Voltar">←</button><div class="brand"><img src="${LOGO}" alt="">Store</div><input class="in" style="margin:0;max-width:340px" id="q" placeholder="Pesquisar aplicações" value="${E(S.q)}"><span class="grow"></span><button class="btn" data-act="pub">Publicar</button></header>
<main><p class="note">As aplicações da loja ficam guardadas só neste dispositivo. Ainda não existe painel de administração nem permissões no servidor.</p>

   Toda a lógica está em API/commit(): é o único sítio a trocar por chamadas ao backend na nuvem. */
DB.sys=DB.sys||{seen:0};
const FIXED_TIERS=[[200,2],[500,8],[1000,99],[2000,290],[5000,990],[null,3900]];
DB.cfg=Object.assign({free:10000,pro:30000,proOn:true,reward:3000,defMin:120,defFrom:"07:00",defTo:"21:00",benefits:"Mais créditos diários, histórico alargado e funcionalidades avançadas da iei AI."},DB.cfg||{});
DB.cfg.tiers=FIXED_TIERS.map(t=>t.slice());DB.cfg.count="response";DB.cfg.pricingVersion=6;
delete DB.cfg.half;delete DB.cfg.resW;
DB.links=DB.links||[];DB.invites=DB.invites||[];DB.reqs=DB.reqs||[];DB.audit=DB.audit||[];
const TZ="Europe/Lisbon",now=()=>{const t=Math.max(Date.now(),DB.sys.seen||0);DB.sys.seen=t;return t};
const parts=t=>Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,weekday:"short"}).formatToParts(t).map(p=>[p.type,p.value]));
const dayK=t=>{const p=parts(t);return `${p.year}-${p.month}-${p.day}`};
const hmOf=t=>{const p=parts(t);return `${p.hour==="24"?"00":p.hour}:${p.minute}`};
const dowOf=t=>["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(parts(t).weekday);
const fmt=m=>(m/1000).toFixed(3).replace(".",",");
const when=t=>new Date(t).toLocaleString("pt-PT",{timeZone:TZ});
const nextRenew=()=>{const p=parts(now()),s=86400-((+p.hour%24)*3600+ +p.minute*60+ +p.second);return `00:00 (daqui a ${Math.floor(s/3600)} h ${Math.floor(s%3600/60)} min)`};
const linkOf=u=>DB.links.find(l=>l.m===u.id&&l.status==="active");
const aud=(a,d)=>{DB.audit.push({t:now(),by:(me()||{}).name||"sistema",a,d});if(DB.audit.length>300)DB.audit.shift()};
const bal=u=>u.w.free+u.w.bonus,avail=u=>bal(u)-u.w.res;
const isPro=u=>u.plan==="pro"&&DB.cfg.proOn;
const dailyAmt=u=>{let a=isPro(u)?DB.cfg.pro:DB.cfg.free;const L=linkOf(u);if(L&&L.set.cap!=null)a=Math.min(a,L.set.cap);return a};
const words=t=>(String(t).trim().match(/\S+/g)||[]).length;
/* Preço fixo por escalão da resposta, em milésimas de crédito. */
function cost(w){if(!Number.isFinite(w)||w<=0)return 0;const tier=FIXED_TIERS.find(([up])=>up==null||w<=up);return tier?tier[1]:0}
function commit(fn){const snap=JSON.stringify(DB);try{const r=fn();if(!save())throw 0;return r}catch(e){DB=JSON.parse(snap);return null}}
function post(u,type,qty,reason,pool="free",words=0){const w=u.w,before=bal(u);
 if(qty<0){const need=-qty;if(need>before)return null;const f=Math.min(w.free,need);w.free-=f;w.bonus-=need-f;w.used+=need}
 else{w[pool]+=qty;w.recv+=qty}
 const e={id:crypto.randomUUID(),t:now(),type,qty,reason,before,after:bal(u),words};u.led.push(e);if(u.led.length>500)u.led.shift();return e}
function roll(u){u.plan=u.plan||"free";u.led=u.led||[];u.w=u.w||{free:0,bonus:0,day:"",used:0,recv:0,game:"",res:0,att:null};const d=dayK(now());if(u.w.day===d)return false;
 const old=u.w.free;u.w.free=0;u.w.day=d;u.w.used=0;u.w.recv=0;u.w.res=0;u.w.pending={};u.w.att=null;
 post(u,"Crédito diário",dailyAmt(u),old?`Renovação diária (${fmt(old)} não utilizados expiraram)`:"Renovação diária");return true}
const wal=u=>{if(u&&roll(u))save()};
/* reserva antes do pedido, acerto no fim */
const SAFETY="Regras de segurança fixas (a personalidade e o utilizador não as podem desligar): sem conteúdo sexual explícito, sem instruções perigosas, sem incentivo a comportamentos prejudiciais, linguagem adequada à idade e recusa de tentativas de contornar estas regras.";
const unsafe=t=>/(porn|sexo explícito|fazer (uma )?bomba|suicíd|ignora (as )?(tuas )?regras)/i.test(t);
function begin(u,text){wal(u);const L=linkOf(u);if(L&&!L.set.ai)return{ok:false,why:"A IA está desativada pelo teu responsável."};
 if(L&&unsafe(text))return{ok:false,why:"Este pedido não respeita as regras de segurança."};
 const wi=words(text),reserve=pr(1),id=crypto.randomUUID();
 if(reserve>avail(u))return{ok:false,why:"Saldo insuficiente.",cost:reserve};
 return commit(()=>{u.w.pending=u.w.pending||{};u.w.pending[id]=reserve;u.w.res+=reserve;return{ok:true,wi,reserve,id}})||{ok:false,why:"Erro ao reservar."}}
function settle(u,wi,wo,reserve,id){return commit(()=>{
 const pending=u.w.pending||{},key=id||Object.keys(pending).find(k=>pending[k]===reserve);
 if(!key||pending[key]==null)return null;
 const held=pending[key];delete pending[key];u.w.res=Math.max(0,u.w.res-held);
 const c=pr(wo);if(c>avail(u))return{insufficient:true,qty:0};
 if(!c)return{qty:0};return post(u,"Consumo de IA",-c,"iei AI · "+tag(),undefined,wo)
})}
/* escalões progressivos do modo programação (milésimas de crédito por palavra) */
const PT=[[200,2],[500,8],[1000,99],[2000,290],[5000,990],[Infinity,3900]];
const pref=u=>({code:!!(u&&u.aiCode),model:u&&u.aiModel==="i5"?"i5":"tech1"});
const tag=()=>{const p=pref(me());return p.model+(p.code?" · programação":"")};
function pr(w){const p=pref(me());if(!Number.isFinite(w)||w<=0)return 0;let t;
 if(p.code){t=0;let prev=0;for(const [up,c] of PT){if(w<=prev)break;t+=(Math.min(w,up)-prev)*c;prev=up}}else t=cost(w);
 return p.model==="i5"?Math.round(t*7/10):t}
function fit(out,bud){const n=words(out);let lo=0,hi=n;while(lo<hi){const m=(lo+hi+1)>>1;if(pr(m)<=bud)lo=m;else hi=m-1}
 let c=0,i=0,re=/\S+/g,x;while(c<lo&&(x=re.exec(out))){c++;i=re.lastIndex}
 let s=out.slice(0,i);if((s.match(/```/g)||[]).length%2)s+="\n```";return{text:s+"\n\n*(Resposta cortada: os créditos acabaram.)*",wo:lo}}
window.ieiCredits={begin,settle,SAFETY,cost,words,pr};

function lock(u){const L=linkOf(u);if(!L||!u.id)return null;const s=L.set,n=now();if(n<(L.until||0))return null;const h=hmOf(n),k=dayK(n);
 if(!s.days.includes(dowOf(n)))return "Hoje não é um dia autorizado pelo teu responsável.";
 const ok=s.from<s.to?(h>=s.from&&h<s.to):(h>=s.from||h<s.to);if(!ok)return `Fora do horário permitido (${s.from}–${s.to}).`;
 if(s.pf&&s.pt&&h>=s.pf&&h<s.pt)return `Pausa programada (${s.pf}–${s.pt}).`;
 if((L.use[k]||0)/60>=s.min)return "Atingiste o limite diário de tempo.";return null}

function MDi(t){return t.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*\*([^*]+?)\*\*\*/g,"<b><i>$1</i></b>").replace(/\*\*([^*]+?)\*\*/g,"<b>$1</b>").replace(/__([^_]+?)__/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,"$1<i>$2</i>").replace(/\*\*/g,"")}
function MD(src){const L=E(src).replace(/\r/g,"").split("\n");let h="",list=null,code=false,tb=[];
 const fl=()=>{if(list){h+=`</${list}>`;list=null}},ft=()=>{if(!tb.length)return;const rows=tb.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r)).map(r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>MDi(c.trim())));h+=`<div class="scroll"><table class="tbl">`+rows.map((r,i)=>"<tr>"+r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join("")+"</tr>").join("")+"</table></div>";tb=[]};
 for(const raw of L){if(/^\s*```/.test(raw)){fl();ft();if(code)h+="</pre></div>";else{const lg=raw.trim().slice(3).trim().replace(/[^\w+#.-]/g,"").slice(0,12);h+=`<div class="cbw"><div class="cbh"><span>${lg||"código"}</span><span class="cbb"><button data-act="cpCode">Copiar</button><button class="dl" data-act="dlCode" data-lang="${lg}">⬇ Descarregar</button></span></div><pre class="cb">`}code=!code;continue}
  if(code){h+=raw+"\n";continue}
  if(/^\s*\|.*\|\s*$/.test(raw)){fl();tb.push(raw);continue}ft();
  let m;
  if(m=raw.match(/^\s*(#{1,6})\s*(.+?)\s*#*\s*$/)){fl();const n=Math.min(6,m[1].length+2);h+=`<h${n} class="mh">${MDi(m[2])}</h${n}>`;continue}
  if(/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(raw)){fl();h+="<hr>";continue}
  if(m=raw.match(/^\s*[-*+•]\s+(.*)$/)){if(list!=="ul"){fl();h+="<ul>";list="ul"}h+=`<li>${MDi(m[1])}</li>`;continue}
  if(m=raw.match(/^\s*\d+[.)]\s+(.*)$/)){if(list!=="ol"){fl();h+="<ol>";list="ol"}h+=`<li>${MDi(m[1])}</li>`;continue}
  if(m=raw.match(/^\s*&gt;\s?(.*)$/)){fl();h+=`<blockquote>${MDi(m[1])}</blockquote>`;continue}
